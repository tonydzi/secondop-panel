[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secondop-panel"
# Keep this equal to the release tag without the leading "v" - publish.yml refuses to build
# when they disagree. They disagreed once (tag v0.1.0, package 1.0.0) and the mismatch would
# have shipped a 1.0 to PyPI from a repo whose history says 0.1.
version = "0.1.1"
description = "A second opinion on your code from a PANEL of vendors, not one model. One reviewer is a special case of a panel, and it should be named out loud."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Palo Alto AI Research Lab" }]
keywords = ["code-review", "llm", "second-opinion", "panel", "multi-vendor", "cli", "agents"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/tonydzi/secondop-panel"
Source = "https://github.com/tonydzi/secondop-panel"
Issues = "https://github.com/tonydzi/secondop-panel/issues"
Changelog = "https://github.com/tonydzi/secondop-panel/releases"

[project.scripts]
secondop-panel = "secondop_panel:main"

[tool.hatch.build.targets.wheel]
only-include = ["secondop_panel.py"]

[tool.hatch.build.targets.sdist]
include = ["secondop_panel.py", "README.md", "LICENSE", "PROMPT.md", "docs", "panel.example.json", "pyproject.toml"]
