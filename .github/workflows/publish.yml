# Publish to PyPI on every published GitHub release.
#
# Uses PyPI Trusted Publishing (OIDC): no API token is stored anywhere, not in a
# repository secret and not on a laptop. PyPI verifies the workflow's identity
# directly. Set it up once at
#   https://pypi.org/manage/account/publishing/
# with owner "tonydzi", repository "secondop-panel", workflow "publish.yml",
# environment "pypi".
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must equal the package version
        # A release tag and a pyproject version that disagree publish a number nobody
        # announced - and PyPI never lets you re-upload that number. Fail before the build.
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib,sys;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::release tag $TAG != package version $PKG"; exit 1; }

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # the whole point: OIDC instead of a stored token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
